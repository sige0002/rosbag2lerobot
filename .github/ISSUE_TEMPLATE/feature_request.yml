name: Feature request
description: Suggest a new capability, robot configuration, or CLI option.
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement! Please describe the use case
        and, if possible, a rough API / CLI shape.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and discussions for similar proposals.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and why the current tool falls short.
      placeholder: |
        I want to convert bags recorded with a mobile manipulator that uses
        compressed depth images, but the current decoder only handles
        CompressedImage for RGB.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A rough sketch — code, CLI flags, config fields, anything concrete.
      placeholder: |
        Add a decoder for sensor_msgs/msg/CompressedImage with format="16UC1;
        compressedDepth" that decodes the 12-byte header + PNG body and
        returns a float32 depth array.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Upstream references, related LeRobot PRs, links to bag samples, etc.
