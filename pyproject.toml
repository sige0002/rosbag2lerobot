[project]
name = "rosbag2lerobot"
version = "0.1.0"
description = "ROS2 rosbag to LeRobot Dataset v3.0 converter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
license-files = ["LICENSE"]
authors = [
    { name = "Sadasue Yuki", email = "yu092519703@gmail.com" },
]
dependencies = [
    "rosbags>=0.9.20",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "huggingface-hub>=1.10.2",
    "ruff>=0.15.11",
    "av>=12.0.0",
]

[project.scripts]
rosbag2lerobot = "rosbag2lerobot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosbag2lerobot"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
notebook = [
    "ipykernel>=6.29.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that take noticeable wall time (opt-in via '-m slow')",
    "nvenc: marks tests that require a real NVENC-capable ffmpeg build",
    "integration: marks end-to-end tests that require real data or external services",
]
